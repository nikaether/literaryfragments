<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fragments — aether.nic</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --deep: #1b1830;
    --mid: #34294f;
    --dusk: #4a3a66;
    --lavender: #b9a8dd;
    --lavender-soft: #d8cdec;
    --teal: #7fa89f;
    --rose: #d7aebd;
    --cream: #f4ede2;
    --cream-dim: #cfc4d9;
    --ink: #221d33;
    --line: rgba(244, 237, 226, 0.16);
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "EB Garamond", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--body);
    color: var(--cream);
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74, 58, 102, 0.55), transparent 60%),
      linear-gradient(180deg, rgba(27, 24, 48, 0.92), rgba(34, 29, 51, 0.95)),
      url('https://images.unsplash.com/photo-1501139083538-0139583c060f?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }
  ::selection { background: var(--dusk); color: var(--cream); }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: clamp(1.4rem, 4vw, 3rem);
    padding: 1.1rem 1.5rem;
    background: rgba(27, 24, 48, 0.78);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  nav a {
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
    transition: color 0.3s ease;
    position: relative;
  }
  nav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 1px;
    background: var(--lavender);
    transform: scaleX(0);
    transition: transform 0.35s ease;
  }
  nav a:hover { color: var(--cream); }
  nav a:hover::after { transform: scaleX(1); }

  header {
    text-align: center;
    padding: clamp(4rem, 10vw, 6.5rem) 1.5rem 3rem;
    position: relative;
    z-index: 1;
  }

  .eyebrow {
    display: block;
    font-family: var(--display);
    font-style: italic;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--teal);
    font-size: 0.9rem;
    margin-bottom: 1rem;
  }

  header h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.8rem, 8vw, 4.2rem);
    margin: 0;
    background: linear-gradient(180deg, var(--cream) 20%, var(--lavender-soft) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-wrap: balance;
  }

  header p.tagline {
    margin: 1.4rem auto 0;
    max-width: 34rem;
    color: var(--cream-dim);
    font-style: italic;
    font-size: 1.05rem;
  }

  .ruin-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.8rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1.5rem 5rem;
    position: relative;
    z-index: 1;
  }

  .fragment {
    position: relative;
    padding: 1.7rem 1.9rem;
    background: rgba(244, 237, 226, 0.06);
    border: 1px solid var(--line);
    border-radius: 4px;
    backdrop-filter: blur(3px);
    cursor: pointer;
    transition: transform 0.35s ease, background 0.35s ease, border-color 0.35s ease;
  }

  .fragment::before {
    content: "";
    position: absolute;
    left: 0;
    top: 12%;
    height: 76%;
    width: 2px;
    background: linear-gradient(180deg, transparent, var(--lavender), transparent);
    opacity: 0.7;
  }

  .fragment:hover {
    transform: translateY(-4px);
    background: rgba(244, 237, 226, 0.1);
    border-color: var(--lavender);
  }

  .fragment p {
    margin: 0.5rem 0;
    color: var(--cream);
    font-size: 1rem;
    line-height: 1.75;
  }

  .fragment p:first-child { margin-top: 0; }
  .fragment p:last-child { margin-bottom: 0; }

  .fragment p:first-child:is(.meta) {
    font-family: var(--display);
    font-style: italic;
    color: var(--teal);
    font-size: 0.85rem;
    letter-spacing: 0.06em;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(19, 17, 32, 0.9);
    backdrop-filter: blur(6px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    overflow-y: auto;
    padding: 2rem 1.2rem;
  }

  .overlay .fragment {
    max-width: 640px;
    width: 100%;
    cursor: default;
    background: rgba(34, 29, 51, 0.96);
    border-color: var(--lavender);
  }
  .overlay .fragment:hover { transform: none; }

  footer {
    text-align: center;
    padding: 3rem 1.5rem;
    background: var(--ink);
    border-top: 1px solid var(--line);
    color: var(--cream-dim);
    font-size: 0.85rem;
    position: relative;
    z-index: 1;
  }

  footer a.back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    font-family: var(--display);
    font-style: italic;
    color: var(--lavender-soft);
    border-bottom: 1px solid transparent;
    padding-bottom: 0.15rem;
    transition: border-color 0.3s ease, gap 0.3s ease, color 0.3s ease;
  }
  footer a.back:hover { border-color: var(--lavender); gap: 0.8rem; color: var(--cream); }
  footer a.back svg { width: 0.95rem; height: 0.95rem; transform: rotate(180deg); }

  @media (max-width: 480px) {
    .ruin-container { grid-template-columns: 1fr; gap: 1.2rem; padding: 0.5rem 1rem 3rem; }
    .fragment { padding: 1.3rem 1.4rem; }
  }
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="poems.html">Poetry</a>
  <a href="pharmaceutics.html">Pharmaceutics</a>
</nav>

<header>
  <span class="eyebrow">Chapter II</span>
  <h1>Fragments</h1>
  <p class="tagline">Notes, aphorisms, and incomplete thoughts — written quickly, revised slowly, or left unresolved.</p>
</header>

<main class="ruin-container" id="fragments-list"></main>
<p class="more" id="empty-note" hidden style="text-align:center; color: var(--cream-dim); font-style: italic; opacity: .65; margin: -2rem 0 3rem;">more will gather here in time</p>

<!-- click magnify overlay -->
<div class="overlay" id="overlay"></div>

<footer>
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    Back to archive
  </a>
  <div style="margin-top: 1rem;">© <span id="year"></span> aether.nic</div>
</footer>

<script src="assets/site.js"></script>
<script>
  try { document.getElementById("year").textContent = new Date().getFullYear(); } catch (e) {}

  var overlay = document.getElementById('overlay');

  function wireMagnify(frag) {
    frag.addEventListener('click', () => {
      const clone = frag.cloneNode(true);
      overlay.innerHTML = '';
      overlay.appendChild(clone);
      overlay.style.display = 'flex';
    });
  }

  overlay.addEventListener('click', () => {
    overlay.style.display = 'none';
  });

  (async function () {
    var list = document.getElementById("fragments-list");
    var emptyNote = document.getElementById("empty-note");
    try {
      var fragments = await AetherSite.fetchJson("data/fragments.json");
      if (!fragments.length) {
        emptyNote.hidden = false;
        return;
      }
      fragments.forEach(function (entry) {
        var article = document.createElement("article");
        article.className = "fragment";
        article.innerHTML = AetherSite.renderFragment(entry);
        list.appendChild(article);
        wireMagnify(article);
      });
    } catch (e) {
      emptyNote.hidden = false;
      emptyNote.textContent = "fragments could not be loaded right now";
    }
  })();
</script>

</body>
</html>
